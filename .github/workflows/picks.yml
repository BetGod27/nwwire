# Locks the weekly NFL picks before kickoff, grades them after the games,
# and commits the updated record (data/record.json) so the site shows it.
name: Update picks & record

on:
  schedule:
    - cron: "15 */3 * * *" # every 3 hours
  workflow_dispatch: {}     # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: picks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Build, lock & grade picks
        run: ruby scripts/nw_picks.rb
      - name: Commit record
        run: |
          git config user.name "nw-wire-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/record.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update picks & record"
            git push
          fi
